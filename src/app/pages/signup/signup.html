<div class="login-page">

  <div class="login-card">

    <h1>Create Account</h1>

    <p>
      Create your JobTrack account.
    </p>

    @if (errorMessage) {

      <div class="error-message">
        {{ errorMessage }}
      </div>

    }

    <form (ngSubmit)="signup()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
        />

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a password"
        />

      </div>

      <button
        type="submit"
        class="login-button"
      >
        Create Account
      </button>

    </form>

  </div>

</div>
