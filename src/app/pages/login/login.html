<div class="login-page">

  <div class="login-card">

    <div class="brand">
      <div class="brand-mark">
        JT
      </div>

      <span>
        JobTrack
      </span>
    </div>


    <div class="login-header">

      <span class="page-eyebrow">
        ACCOUNT
      </span>

      <h1>
        Welcome Back
      </h1>

      <p>
        Login to your JobTrack account.
      </p>

    </div>


    @if (errorMessage) {

      <div class="error-message">
        {{ errorMessage }}
      </div>

    }


    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />

      </div>


      <button
        type="submit"
        class="login-button"
      >
        Login
      </button>

    </form>


    <div class="signup-link">

      <span>
        Don't have an account?
      </span>

      <a routerLink="/signup">
        Create a new account
      </a>

    </div>

  </div>

</div>
